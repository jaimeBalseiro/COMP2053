<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Encabezados y div tag</title>
</head>
<body>
    <!-- Encabezado de la página -->
    <div class="header" style="background-color: lightblue; text-align: center;">
        <h1>Mi Página Web</h1>
    </div>
    <!-- Área de contenido principal -->
    <div class="content" style="background-color: lightgray;">
        <!-- Primera sección -->
        <div style="background-color: white;">
            <h2>Sobre mí</h2>
            <p>
                Mi nombre es Jaime y estoy aprendiendo a crear páginas web
                utilizando el div tag.
            </p>
        </div>
        <!-- Segunda sección -->
        <div style="background-color: beige;">
            <h2>Mis intereses</h2>
            <p>
                Me interesa ir al gymnacio, salir con mis amigos y aprender
                cosas nuevas sobre programación.
            </p>
        </div>
    </div>
    <!-- Pie de página -->
    <div class="footer" style="background-color: lightblue; text-align: center;">
        <p>&copy; 2026 Jaime. Todos los derechos reservados.</p> <!-- Aprendi hacer el copyright logo jaja -->
    </div>
</body>
</html>
