<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
</head>
<body>
    <!-- Título principal -->
    <h1>Mi Primera Página Web</h1>
    <!-- Subtítulo -->
    <h2>HTML</h2>
    <!-- Párrafo con em y strong, bold y estilo en texto -->
    <p>
        Bienvenidos a mi página web. Estoy aprendiendo a utilizar
        <strong>HTML</strong> para crear páginas web y me parece
        <em>muy interesante</em>.
    </p>
    <!-- Lista desordenada -->
    <h2>Mis intereses</h2>
    <ul>
        <li>Gymnacio</li>
        <li>Conversar</li>
        <li>Salir</li>
    </ul>
    <!-- Imagen con descripción -->
    <figure>
        <img src="jaime.jpeg" alt="Este soy yo!!" width="400">
        <figcaption>
            Una foto que me tire en casa de mi hermano.
        </figcaption>
    </figure>
    <!-- Enlace externo -->
    <p>
        Visita
        <a href="https://www.w3schools.com/" target="_blank">
            W3Schools
        </a>
        para aprender más sobre HTML.
    </p>
    <!-- Formulario -->
    <h2>Formulario de contacto</h2>
    <form>
        <label for="nombre">Nombre:</label>
        <br>
        <input type="text" id="nombre" name="nombre">
        <br><br>
        <label for="comentarios">Comentarios:</label>
        <br>
        <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
        <br><br>
        <button type="submit">"Enviar"</button>
    </form>
</body>
</html>
