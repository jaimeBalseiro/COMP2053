<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - Move</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Move</h1>
        <p>Formulario de Suscripción</p>
    </header>
    <section id="pagina-suscripcion">
        <h2>Únete a Nuestra Comunidad</h2>
        <p>
            Completa el siguiente formulario para recibir información
            sobre nuestras actividades y eventos deportivos.
        </p>
        <form>
            <input type="text"
                   name="nombre"
                   placeholder="Nombre"
                   required>
            <input type="email"
                   name="correo"
                   placeholder="Correo electrónico"
                   required>
            <button type="submit">
                Enviar
            </button>
        </form>
        <br><br>
        <a class="boton-regresar" href="index.html">
            Regresar a la Página Principal
        </a>
    </section>
</body>
</html>
