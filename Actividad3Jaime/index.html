<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Actividad de CSS</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Título principal con un ID -->
    <h1 id="titulo-principal">Mi Página Web</h1>
    <!-- Párrafo -->
    <p>
        Bienvenidos a mi página web. En esta actividad estoy aprendiendo
        a utilizar diferentes selectores de CSS.
    </p>
    <!-- Lista desordenada -->
    <h2>Mis intereses</h2>
    <ul>
        <li class="destacado">Tecnología</li>
        <li>Videojuegos</li>
        <li class="destacado">Ejercicio</li>
    </ul>
    <!-- Segundo párrafo -->
    <p>
        HTML permite crear la estructura de una página web, mientras que
        CSS permite modificar su apariencia.
    </p>
</body>
</html>
