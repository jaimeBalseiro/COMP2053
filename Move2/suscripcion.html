
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - Move 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-suscripcion">

    <!-- Encabezado -->
    <header>
        <h1>Move 2</h1>
        <p>Formulario de Suscripción</p>
    </header>

    <main>
        <!-- Formulario de suscripción -->
        <section>
            <h2>Suscríbete a Nuestra Organización</h2>
            <p>Completa el formulario para recibir información sobre nuestras actividades.</p>

            <form action="#" method="get" class="formulario-extra">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <button type="submit">Enviar</button>

            </form>

            <!-- Enlace para regresar -->
            <a href="index.html" class="boton-regresar">Regresar a la página principal</a>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>Contacto: Move2@ejemplo.com</p>
        <p>&copy; 2026 Move 2</p>
    </footer>
</body>
</html>
